<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Solicitud Recibida! - Go Clean</title>
    
    <!-- Fuente Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-blue: #3385d9; /* Azul principal actualizado */
            --brand-dark: #1e1b4b;
            --bg-page: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #111827;
        }

        .container {
            background: #ffffff;
            padding: 60px 40px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(51, 133, 217, 0.15);
            max-width: 550px;
            width: 90%;
            text-align: center;
            border: 1px solid #f1f5f9;
            position: relative;
            overflow: hidden;
        }

        /* Decoración superior */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--brand-blue);
        }

        .success-icon {
            font-size: 50px;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            width: 90px;
            height: 90px;
            border-radius: 30px;
            color: var(--brand-blue);
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -1px;
            color: var(--brand-dark);
        }

        p {
            font-size: 16px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 32px;
            padding: 0 20px;
        }

        /* Caja de Referencia */
        .ref-box {
            background-color: #f8fafc;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 32px;
            border: 2px dashed #e2e8f0;
            display: inline-block;
            min-width: 240px;
        }
        .ref-label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
            margin-bottom: 8px;
            display: block;
        }
        .ref-code {
            font-size: 24px;
            font-weight: 800;
            color: var(--brand-blue);
            font-family: 'Inter', monospace;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .btn-home {
            display: inline-block;
            padding: 18px 40px;
            background-color: var(--brand-blue);
            color: #ffffff;
            text-decoration: none;
            font-weight: 800;
            border-radius: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(51, 133, 217, 0.2);
            width: 100%;
            max-width: 300px;
        }

        .btn-home:hover {
            background-color: #256bb3;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(51, 133, 217, 0.3);
        }

        .social-section {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid #f1f5f9;
        }

        .social-link {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .social-link:hover {
            color: var(--brand-blue);
        }

        .ig-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @media (max-width: 480px) {
            .container { padding: 40px 20px; border-radius: 30px; }
            h1 { font-size: 26px; }
            .btn-home { padding: 16px 30px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h1>¡Solicitud Recibida!</h1>
        <p>
            Gracias por confiar en nosotros. Un ejecutivo de <strong>Go Clean</strong> revisará tus datos y te contactará con una propuesta personalizada.
        </p>

        <!-- Caja de Referencia Dinámica -->
        <div class="ref-box" id="ref-box" style="display: none;">
            <span class="ref-label">Número de Seguimiento</span>
            <span class="ref-code" id="ref-code">---</span>
        </div>
        
        <div class="btn-group">
            <a href="/" class="btn-home">Volver al Inicio</a>
        </div>

        <div class="social-section">
            <a href="https://www.instagram.com/goclean_santiago/" target="_blank" class="social-link">
                <svg class="ig-icon" viewBox="0 0 24 24">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
                <span>@goclean_santiago</span>
            </a>
        </div>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        window.onload = function() {
            const ref = getQueryParam('ref');
            if (ref) {
                document.getElementById('ref-code').textContent = '#' + ref;
                document.getElementById('ref-box').style.display = 'inline-block';
            }
        };
    </script>

</body>
</html>
